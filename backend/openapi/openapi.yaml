                - checksum_sha256
                - content_type
            type: object
        media.TicketResponse:
            properties:
                expires_at:
                    format: date-time
                    type: string
                headers:
                    additionalProperties:
                        type: string
                    type: object
                media_id:
                    type: string
                method:
                    type: string
                upload_url:
                    type: string
            type: object
