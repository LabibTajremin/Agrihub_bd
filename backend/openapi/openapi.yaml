                checksum_sha256:
                    type: string
                content_type:
                    type: string
                created_at:
                    format: date-time
                    type: string
                download_url:
                    type: string
                id:
                    type: string
                phash:
                    type: string
                size_bytes:
                    format: int64
                    type: integer
                status:
                    type: string
                uploaded_at:
                    format: date-time
