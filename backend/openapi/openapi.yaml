components:
    schemas:
        advisory.Criteria:
            properties:
                market:
                    type: number
                pest:
                    type: number
                seed:
                    type: number
                soil:
                    type: number
                water:
                    type: number
            type: object
        advisory.CropDetail:
            properties:
                criteria:
                    $ref: '#/components/schemas/advisory.Criteria'
                crop_code:
                    type: string
                name_key:
                    type: string
                outlook:
                    $ref: '#/components/schemas/advisory.Outlook'
                roi:
                    $ref: '#/components/schemas/advisory.ROI'
                score:
                    type: number
                season:
                    type: string
                yield_kg:
                    $ref: '#/components/schemas/advisory.Triple'
            type: object
        advisory.NarrateRequest:
            properties:
                chart:
                    type: string
                data:
                    additionalProperties:
                        type: number
                    type: object
                lang:
                    type: string
            required:
                - chart
                - lang
            type: object
        advisory.Narration:
            properties:
                params:
                    additionalProperties:
                        type: string
                    type: object
                text:
                    type: string
                text_key:
                    type: string
                voice_key:
                    type: string
            type: object
        advisory.Outlook:
            properties:
                data_age_seconds:
                    format: int64
                    type: integer
                rain_mm:
                    format: int64
                    type: integer
                stale:
                    type: boolean
            type: object
        advisory.ROI:
            properties:
                costs_poisha:
                    additionalProperties:
                        format: int64
                        type: integer
                    type: object
                gross_poisha:
                    $ref: '#/components/schemas/advisory.Triple'
                net_poisha:
                    $ref: '#/components/schemas/advisory.Triple'
                return_bp:
                    format: int64
                    type: integer
                total_cost_poisha:
                    format: int64
                    type: integer
                yield_kg:
                    $ref: '#/components/schemas/advisory.Triple'
            type: object
        advisory.ROIRequest:
            properties:
                costs_poisha:
                    additionalProperties:
                        format: int64
                        type: integer
                    type: object
            type: object
        advisory.Recommendation:
            properties:
                criteria:
                    $ref: '#/components/schemas/advisory.Criteria'
                crop_code:
                    type: string
                name_key:
                    type: string
                score:
                    type: number
                yield_kg:
                    $ref: '#/components/schemas/advisory.Triple'
            type: object
        advisory.Recommendations:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/advisory.Recommendation'
                    type: array
                outlook:
                    $ref: '#/components/schemas/advisory.Outlook'
                season:
                    type: string
            type: object
        advisory.Rotation:
            properties:
                nitrogen_deficit:
                    type: boolean
                steps:
                    items:
                        $ref: '#/components/schemas/advisory.RotationStep'
                    type: array
            type: object
        advisory.RotationStep:
            properties:
                crop_code:
                    type: string
                name_key:
                    type: string
                nitrogen_after_kg_ha:
                    format: int64
                    type: integer
                nitrogen_before_kg_ha:
                    format: int64
                    type: integer
                score:
                    type: number
                season:
                    type: string
            type: object
        advisory.Triple:
            properties:
                high:
                    format: int64
                    type: integer
                likely:
                    format: int64
                    type: integer
                low:
                    format: int64
                    type: integer
            type: object
        alert.Alert:
            properties:
                body_key:
                    type: string
                created_at:
                    format: date-time
                    type: string
                id:
                    type: string
                kind:
                    type: string
                params:
                    additionalProperties:
                        type: string
                    type: object
                read_at:
                    format: date-time
                    nullable: true
                    type: string
                severity:
                    type: string
                title_key:
                    type: string
            type: object
        alert.Inbox:
            properties:
                alerts:
                    items:
                        $ref: '#/components/schemas/alert.Alert'
                    type: array
                unread_count:
                    format: int64
                    type: integer
            type: object
        alert.ReadAll:
            properties:
                updated:
                    format: int64
                    type: integer
            type: object
        alert.Subscription:
            properties:
                cell_key:
                    type: string
                kinds:
                    items:
                        type: string
                    type: array
                lat:
                    type: number
                lng:
                    type: number
                updated_at:
                    format: date-time
                    type: string
            type: object
        alert.SubscriptionRequest:
            properties:
                kinds:
                    items:
                        type: string
                    type: array
                lat:
                    type: number
                lng:
                    type: number
            required:
                - kinds
            type: object
        app.Health:
            properties:
                status:
                    type: string
                time:
                    format: date-time
                    type: string
            type: object
        app.MetricsSnapshot:
            properties:
                series:
                    items:
                        $ref: '#/components/schemas/metrics.Series'
                    type: array
            type: object
        assistant.AskRequest:
            properties:
                audio_media_id:
                    type: string
                context:
                    additionalProperties:
                        type: string
                    type: object
                lang:
                    type: string
                transcript:
                    type: string
            required:
                - lang
            type: object
        assistant.AskResponse:
            properties:
                answer_key:
                    type: string
                follow_ups:
                    items:
                        type: string
                    type: array
                intent:
                    type: string
                params:
                    additionalProperties:
                        type: string
                    type: object
                understood:
                    type: boolean
            type: object
        diagnosis.AnnotateRequest:
            properties:
                note:
                    nullable: true
                    type: string
                saved:
                    nullable: true
                    type: boolean
            type: object
        diagnosis.CreateScanRequest:
            properties:
                captured_at:
                    format: date-time
                    type: string
                crop_code:
                    type: string
                field_id:
                    type: string
                idempotency_key:
                    type: string
                lang:
                    type: string
                media_id:
                    type: string
            required:
                - crop_code
                - media_id
            type: object
        diagnosis.Diagnosis:
            properties:
                confidence:
                    type: number
                description_key:
                    type: string
                disease_code:
                    type: string
                healthy:
                    type: boolean
                model_version:
                    type: string
                name_key:
                    type: string
                plans:
                    items:
                        $ref: '#/components/schemas/diagnosis.Plan'
                    type: array
                severity:
                    type: string
            type: object
        diagnosis.Plan:
            properties:
                safety_key:
                    type: string
                steps:
                    items:
                        type: string
                    type: array
                variant:
                    type: string
            type: object
        diagnosis.Scan:
            properties:
                captured_at:
                    format: date-time
                    type: string
                created_at:
                    format: date-time
                    type: string
                crop_code:
                    type: string
                diagnosis:
                    allOf:
                        - $ref: '#/components/schemas/diagnosis.Diagnosis'
                    nullable: true
                field_id:
                    type: string
                id:
                    type: string
                media_id:
                    type: string
                note:
                    type: string
                saved:
                    type: boolean
                status:
                    type: string
                updated_at:
                    format: date-time
                    type: string
            type: object
        diagnosis.ScanList:
            properties:
                next_before:
                    format: date-time
                    nullable: true
                    type: string
                scans:
                    items:
                        $ref: '#/components/schemas/diagnosis.Scan'
                    type: array
            type: object
        diagnosis.SyncOperation:
            properties:
                annotation:
                    allOf:
                        - $ref: '#/components/schemas/diagnosis.AnnotateRequest'
                    nullable: true
                create:
                    allOf:
                        - $ref: '#/components/schemas/diagnosis.CreateScanRequest'
                    nullable: true
                idempotency_key:
                    type: string
                kind:
                    type: string
                scan_id:
                    type: string
                seq:
                    format: int64
                    type: integer
            required:
                - idempotency_key
            type: object
        diagnosis.SyncRequest:
            properties:
                operations:
                    items:
                        $ref: '#/components/schemas/diagnosis.SyncOperation'
                    type: array
            required:
                - operations
            type: object
        diagnosis.SyncResponse:
            properties:
                results:
                    items:
                        $ref: '#/components/schemas/diagnosis.SyncResult'
                    type: array
            type: object
        diagnosis.SyncResult:
            properties:
                error_code:
                    type: string
                idempotency_key:
                    type: string
                outcome:
                    type: string
                scan_id:
                    type: string
            type: object
        farm.Area:
            properties:
                acre_milli:
                    format: int64
                    type: integer
                bigha_milli:
                    format: int64
                    type: integer
                decimal_milli:
                    format: int64
                    type: integer
                hectare_milli:
                    format: int64
                    type: integer
                unit:
                    type: string
                value_milli:
                    format: int64
                    type: integer
            type: object
        farm.AreaIn:
            properties:
                unit:
                    type: string
                value_milli:
                    format: int64
                    type: integer
            type: object
        farm.Crop:
            properties:
                code:
                    type: string
                cost_poisha_per_ha:
                    additionalProperties:
                        format: int64
                        type: integer
                    type: object
                duration_days:
                    format: int64
                    type: integer
                name_key:
                    type: string
                nitrogen_delta_kg_ha:
                    format: int64
                    type: integer
                ph_max:
                    type: number
                ph_min:
                    type: number
                price_poisha_per_kg:
                    format: int64
                    type: integer
                seasons:
                    items:
                        type: string
                    type: array
                textures:
                    items:
                        type: string
                    type: array
                water_need_mm:
                    format: int64
                    type: integer
                yield_kg_ha:
                    $ref: '#/components/schemas/farm.Yield'
            type: object
        farm.CropList:
            properties:
                crops:
                    items:
                        $ref: '#/components/schemas/farm.Crop'
                    type: array
            type: object
        farm.Field:
            properties:
                area:
                    $ref: '#/components/schemas/farm.Area'
                created_at:
                    format: date-time
                    type: string
                district:
                    type: string
                id:
                    type: string
                irrigation:
                    type: string
                location:
                    $ref: '#/components/schemas/farm.Location'
                name:
                    type: string
                owner_id:
                    type: string
                plots:
                    items:
                        $ref: '#/components/schemas/farm.Plot'
                    type: array
                soil:
                    allOf:
                        - $ref: '#/components/schemas/farm.Soil'
                    nullable: true
                updated_at:
                    format: date-time
                    type: string
            type: object
        farm.FieldList:
            properties:
                fields:
                    items:
                        $ref: '#/components/schemas/farm.Field'
                    type: array
            type: object
        farm.FieldPatchRequest:
            properties:
                area:
                    allOf:
                        - $ref: '#/components/schemas/farm.AreaIn'
                    nullable: true
                district:
                    nullable: true
                    type: string
                irrigation:
                    nullable: true
                    type: string
                location:
                    allOf:
                        - $ref: '#/components/schemas/farm.Location'
                    nullable: true
                name:
                    nullable: true
                    type: string
            type: object
        farm.FieldRequest:
            properties:
                area:
                    $ref: '#/components/schemas/farm.AreaIn'
                district:
                    type: string
                irrigation:
                    type: string
                location:
                    $ref: '#/components/schemas/farm.Location'
                name:
                    type: string
                soil:
                    allOf:
                        - $ref: '#/components/schemas/farm.Soil'
                    nullable: true
            required:
                - name
            type: object
        farm.Location:
            properties:
                lat:
                    type: number
                lng:
                    type: number
            type: object
        farm.Plot:
            properties:
                area:
                    $ref: '#/components/schemas/farm.Area'
                crop_code:
                    type: string
                id:
                    type: string
                name:
                    type: string
                sown_on:
                    format: date-time
                    nullable: true
                    type: string
            type: object
        farm.PlotRequest:
            properties:
                area:
                    $ref: '#/components/schemas/farm.AreaIn'
                crop_code:
                    type: string
                name:
                    type: string
                sown_on:
                    format: date-time
                    nullable: true
                    type: string
            required:
                - crop_code
                - name
            type: object
        farm.Soil:
            properties:
                nitrogen_kg_ha:
                    format: int64
                    type: integer
                organic_matter_pct:
                    type: number
                ph:
                    type: number
                phosphorus_kg_ha:
                    format: int64
                    type: integer
                potassium_kg_ha:
                    format: int64
                    type: integer
                tested_on:
                    format: date-time
                    nullable: true
                    type: string
                texture:
                    type: string
            type: object
        farm.Yield:
            properties:
                high:
                    format: int64
                    type: integer
                likely:
                    format: int64
                    type: integer
                low:
                    format: int64
                    type: integer
            type: object
        httpx.ErrorBody:
            properties:
                error:
                    $ref: '#/components/schemas/httpx.ErrorDetail'
            type: object
        httpx.ErrorDetail:
            properties:
                code:
                    type: string
                fields:
                    additionalProperties:
                        type: string
                    type: object
                message:
                    type: string
                request_id:
                    type: string
            type: object
        identity.OTPRequested:
            properties:
                dev_code:
                    type: string
                expires_at:
                    format: date-time
                    type: string
            type: object
        identity.PhoneRequest:
            properties:
                phone:
                    type: string
            required:
                - phone
            type: object
        identity.RefreshRequest:
            properties:
                refresh_token:
                    type: string
            required:
                - refresh_token
            type: object
        identity.Session:
            properties:
                access_token:
                    type: string
                expires_at:
                    format: date-time
                    type: string
                refresh_expires_at:
                    format: date-time
                    type: string
                refresh_token:
                    type: string
                token_type:
                    type: string
                user:
                    $ref: '#/components/schemas/identity.User'
            type: object
        identity.Tokens:
            properties:
                access_token:
                    type: string
                expires_at:
                    format: date-time
                    type: string
                refresh_expires_at:
                    format: date-time
                    type: string
                refresh_token:
                    type: string
                token_type:
                    type: string
            type: object
        identity.UpdateMeRequest:
            properties:
                district:
                    nullable: true
                    type: string
                language:
                    nullable: true
                    type: string
                name:
                    nullable: true
                    type: string
            type: object
        identity.User:
            properties:
                created_at:
                    format: date-time
                    type: string
                district:
                    type: string
                id:
                    type: string
                language:
                    type: string
                name:
                    type: string
                phone:
                    type: string
                role:
                    type: string
            type: object
        identity.VerifyRequest:
            properties:
                code:
                    type: string
                phone:
                    type: string
            required:
                - code
                - phone
            type: object
        localization.Clip:
            properties:
                checksum:
                    type: string
                duration_ms:
                    format: int64
                    type: integer
                url:
                    type: string
            type: object
        localization.Dictionary:
            properties:
                entries:
                    additionalProperties:
                        type: string
                    type: object
                full:
                    type: boolean
                lang:
                    type: string
                version:
                    format: int64
                    type: integer
            type: object
        localization.Language:
            properties:
                code:
                    type: string
                has_voice:
                    type: boolean
                is_default:
                    type: boolean
                is_rtl:
                    type: boolean
                name:
                    type: string
                native_name:
                    type: string
                version:
                    format: int64
                    type: integer
            type: object
        localization.Languages:
            properties:
                languages:
                    items:
                        $ref: '#/components/schemas/localization.Language'
                    type: array
            type: object
        localization.UpsertEntriesRequest:
            properties:
                entries:
                    additionalProperties:
                        type: string
                    type: object
            required:
                - entries
            type: object
        localization.UpsertResponse:
            properties:
                changed:
                    format: int64
                    type: integer
                version:
                    format: int64
                    type: integer
            type: object
        localization.UpsertVoiceRequest:
            properties:
                assets:
                    items:
                        $ref: '#/components/schemas/localization.VoiceAssetInput'
