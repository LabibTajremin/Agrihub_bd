            type: object
        localization.VoiceAssetInput:
            properties:
                checksum:
                    type: string
                duration_ms:
                    format: int64
                    type: integer
                key:
                    type: string
                media_id:
                    type: string
                url:
                    type: string
            required:
                - checksum
                - key
                - url
            type: object
        localization.VoiceManifest:
            properties:
                clips:
                    additionalProperties:
                        $ref: '#/components/schemas/localization.Clip'
                    type: object
                full:
                    type: boolean
                lang:
                    type: string
                version:
                    format: int64
                    type: integer
            type: object
        media.Object:
