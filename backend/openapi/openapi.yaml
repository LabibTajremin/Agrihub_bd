                        $ref: '#/components/schemas/weather.Day'
                    type: array
                fetched_at:
                    format: date-time
                    type: string
                stale:
                    type: boolean
            type: object
        weather.Outlook:
            properties:
                current_season:
                    type: string
                data_age_seconds:
                    format: int64
                    type: integer
                rain_mm:
                    additionalProperties:
                        format: int64
                        type: integer
                    type: object
                stale:
                    type: boolean
            type: object
    securitySchemes:
        bearer:
            bearerFormat: JWT
            scheme: bearer
            type: http
info:
    description: Offline-first farming assistant API. Error `message` values are i18n dictionary keys.
    title: AgriSmart API
    version: 1.0.0
openapi: 3.0.3
paths:
    /healthz:
        get:
            operationId: get_healthz
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/app.Health'
                    description: success
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/httpx.ErrorBody'
                    description: error
            summary: Liveness
            tags:
                - platform
    /readyz:
        get:
            operationId: get_readyz
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/app.Health'
                    description: success
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/httpx.ErrorBody'
                    description: error
            summary: Readiness (database reachable)
            tags:
                - platform
    /v1/admin/metrics:
        get:
            operationId: get_v1_admin_metrics
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/app.MetricsSnapshot'
                    description: success
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/httpx.ErrorBody'
                    description: error
            security:
                - bearer: []
            summary: Request metrics
            tags:
                - platform
            x-permission: metrics:read
    /v1/advisory/fields/{id}/crops/{code}:
        get:
            operationId: get_v1_advisory_fields_id_crops_code
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
                - in: path
                  name: code
                  required: true
                  schema:
                    type: string
                - in: query
                  name: season
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/advisory.CropDetail'
                    description: success
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/httpx.ErrorBody'
                    description: error
            security:
                - bearer: []
            summary: One crop on a field
            tags:
                - advisory
            x-permission: advisory:read
    /v1/advisory/fields/{id}/crops/{code}/roi:
        post:
            operationId: post_v1_advisory_fields_id_crops_code_roi
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
                - in: path
                  name: code
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/advisory.ROIRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/advisory.ROI'
                    description: success
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/httpx.ErrorBody'
                    description: error
            security:
                - bearer: []
            summary: ROI with custom costs
            tags:
                - advisory
            x-permission: advisory:read
    /v1/advisory/fields/{id}/recommendations:
        get:
            operationId: get_v1_advisory_fields_id_recommendations
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
                - in: query
                  name: season
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/advisory.Recommendations'
                    description: success
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/httpx.ErrorBody'
                    description: error
            security:
                - bearer: []
            summary: Ranked crops for a field
            tags:
                - advisory
            x-permission: advisory:read
    /v1/advisory/fields/{id}/rotation:
