            properties:
                count:
                    format: int64
                    type: integer
                max_ms:
                    type: number
                route:
                    type: string
                status:
                    format: int64
                    type: integer
                total_ms:
                    type: number
            type: object
        weather.Day:
            properties:
                date:
                    type: string
                humidity_pct:
                    format: int64
                    type: integer
                rain_mm:
                    type: number
                temp_max_c:
                    type: number
                temp_min_c:
                    type: number
                wind_kph:
                    format: int64
                    type: integer
