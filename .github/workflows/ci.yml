name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: go (lint, vet, arch, unit, integration, coverage gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: install golangci-lint
        run: |
          curl -sSfL https://github.com/golangci/golangci-lint/releases/download/v2.14.0/golangci-lint-2.14.0-linux-amd64.tar.gz \
            | tar xz -C /tmp && sudo mv /tmp/golangci-lint-2.14.0-linux-amd64/golangci-lint /usr/local/bin/
      - name: make verify-backend
        run: make verify-backend
      - name: govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0 && cd backend && "$(go env GOPATH)/bin/govulncheck" ./...

  mobile:
    name: flutter (analyze, test, coverage gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: make verify-mobile
        run: make verify-mobile

  e2e:
    name: e2e (Flutter client ↔ Go API ↔ Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: flutter pub get
        run: cd mobile && flutter pub get
      - name: make e2e
        run: make e2e
