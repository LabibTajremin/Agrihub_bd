name: agrismart
description: "AgriSmart — offline-first, voice-navigable farming assistant."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  audioplayers: ^6.8.1
  camera: ^0.12.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  dio: ^5.11.1
  drift: ^2.35.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.0.3
  go_router: ^18.0.1
  image: ^4.10.1
  path: ^1.9.1
  path_provider: ^2.1.6
  plugin_platform_interface: ^2.1.8
  sqlite3: ^3.6.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  connectivity_plus_platform_interface: ^2.1.0
  path_provider_platform_interface: ^2.1.3
  camera_platform_interface: ^2.14.0
  geolocator_platform_interface: ^4.3.0
  audioplayers_platform_interface: ^7.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
