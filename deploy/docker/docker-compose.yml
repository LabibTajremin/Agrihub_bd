# Local production-like stack: API + Postgres + Redis + MinIO.
#   docker compose -f deploy/docker/docker-compose.yml up --build
# Secrets below are development defaults; override them in production.
name: agrismart

x-api-env: &api-env
  AGRI_APP_ENV: development
  AGRI_APP_BASE_URL: http://localhost:8080
  AGRI_DATABASE_URL: postgres://agri:agri@postgres:5432/agrismart?sslmode=disable
  AGRI_DATABASE_POOL_MODE: session
  AGRI_REDIS_URL: redis://redis:6379/0
  AGRI_AUTH_JWT_SECRET: dev-only-jwt-secret-change-me-0123456789
  AGRI_STORAGE_BACKEND: s3
  AGRI_STORAGE_S3_ENDPOINT: minio:9000
  AGRI_STORAGE_S3_BUCKET: agrismart-media
  AGRI_STORAGE_S3_ACCESS_KEY: agrismart
  AGRI_STORAGE_S3_SECRET_KEY: agrismart-secret
  AGRI_FEATURES_EXPOSE_OTP: "true"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agri
      POSTGRES_PASSWORD: agri
      POSTGRES_DB: agrismart
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agri -d agrismart"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: agrismart
      MINIO_ROOT_PASSWORD: agrismart-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  create-bucket:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 agrismart agrismart-secret; do sleep 1; done;
      mc mb --ignore-existing local/agrismart-media"

  migrate:
    build: {context: ../.., dockerfile: deploy/docker/Dockerfile}
    image: agrismart-api:local
    entrypoint: ["/usr/local/bin/migrate", "up"]
    environment: *api-env
    depends_on:
      postgres: {condition: service_healthy}

  seed:
    image: agrismart-api:local
    entrypoint: ["/usr/local/bin/seed"]
    environment: *api-env
    depends_on:
      migrate: {condition: service_completed_successfully}

  api:
    image: agrismart-api:local
    environment: *api-env
    ports: ["8080:8080"]
    depends_on:
      seed: {condition: service_completed_successfully}
      redis: {condition: service_started}
      create-bucket: {condition: service_completed_successfully}

volumes:
  pgdata:
  miniodata:
